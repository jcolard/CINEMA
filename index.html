<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CinéMatch">
  <meta name="description" content="Programmation cinéma épurée et découverte de films — Pathé Wilson & Utopia">
  <title>CinéMatch</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- En-tête épuré -->
    <header class="app-header">
      <div class="header-left">
        <img src="logo.svg" alt="CinéMatch" class="brand-logo">
        <div class="brand-block">
          <div class="brand-row">
            <h1 class="app-title">CinéMatch</h1>
            <span id="sync-indicator" class="sync-indicator hidden" title="Mise à jour automatique en cours"></span>
          </div>
          <div class="cinema-selector-wrap">
            <select id="select-cinema" class="cinema-select" aria-label="Choisir le cinéma">
              <option value="all">Tous (Pathé, Cosmo, ABC, Utopia)</option>
              <option value="pathe">Pathé Wilson</option>
              <option value="cosmo">American Cosmograph</option>
              <option value="abc">ABC Toulouse</option>
              <option value="utopia">Utopia</option>
            </select>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-install-pwa" class="btn-install hidden" type="button" title="Installer l'application">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Installer</span>
        </button>
        <div class="header-badges">
          <span id="badge-likes" class="pill pill-green" title="Films dans vos envies">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span id="count-likes">0</span>
          </span>
        </div>
      </div>
    </header>

    <!-- Conteneur des Vues -->
    <main class="views-container">

      <!-- ============================================== -->
      <!-- VUE 1 (DÉFAUT) : SÉANCES PATHÉ / UTOPIA        -->
      <!-- ============================================== -->
      <section id="view-schedule" class="view active">
        <div class="schedule-header">
          <div id="day-tabs" class="day-tabs"></div>

          <div class="schedule-quick-filters">
            <button class="filter-pill active" data-filter="all">Toutes</button>
            <button class="filter-pill" data-filter="after18">Dès 18h</button>
            <button class="filter-pill" data-filter="liked">Mes envies</button>
            <button class="filter-pill" data-filter="unseen">Non vus</button>
          </div>
        </div>

        <div id="schedule-list" class="schedule-list"></div>
      </section>

      <!-- ============================================== -->
      <!-- VUE 2 : DÉCOUVRIR (SWIPE DECK)                 -->
      <!-- ============================================== -->
      <section id="view-swipe" class="view">
        <div class="swipe-area">
          <div id="card-deck" class="card-deck"></div>

          <div id="deck-empty" class="deck-empty hidden">
            <div class="empty-card">
              <div class="empty-icon-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <h2>Tout est trié</h2>
              <p>Vous avez parcouru tous les films à l'affiche.</p>
              <div class="empty-actions">
                <button id="btn-goto-schedule" class="btn btn-primary">
                  Voir les séances
                </button>
                <button id="btn-reset-deck" class="btn btn-outline">
                  Recommencer le tri
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Barre d'actions épurée -->
        <div class="swipe-controls">
          <button id="btn-seen" class="action-btn btn-seen" title="Déjà vu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="action-label">Vu</span>
          </button>

          <button id="btn-dislike" class="action-btn btn-dislike" title="Passer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            <span class="action-label">Passer</span>
          </button>

          <button id="btn-skip" class="action-btn btn-skip" title="Plus tard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            <span class="action-label">Plus tard</span>
          </button>

          <button id="btn-like" class="action-btn btn-like" title="Envie de voir">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="action-label">Envie</span>
          </button>
        </div>
      </section>

      <!-- ============================================== -->
      <!-- VUE 3 : MES FILMS                              -->
      <!-- ============================================== -->
      <section id="view-selection" class="view">
        <div class="selection-header-bar">
          <div class="selection-tabs">
            <button class="sel-tab active" data-target="liked-list">
              Envies <span class="tab-count" id="stat-liked-count">0</span>
            </button>
            <button class="sel-tab" data-target="seen-list">
              Vus <span class="tab-count" id="stat-seen-count">0</span>
            </button>
            <button class="sel-tab" data-target="disliked-list">
              Ignorés <span class="tab-count" id="stat-disliked-count">0</span>
            </button>
          </div>
        </div>

        <div id="selection-content" class="selection-content">
          <div id="liked-list" class="movie-mini-list active"></div>
          <div id="seen-list" class="movie-mini-list"></div>
          <div id="disliked-list" class="movie-mini-list"></div>
        </div>

        <div class="danger-zone">
          <button id="btn-clear-all" class="btn btn-danger-outline">
            Réinitialiser mes choix
          </button>
        </div>
      </section>

    </main>

    <!-- Navigation inférieure (Séances en 1re position) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="view-schedule">
        <svg class="nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="nav-text" id="nav-schedule-label">Séances Pathé</span>
      </button>
      <button class="nav-item" data-view="view-swipe">
        <div class="nav-icon-wrap">
          <svg class="nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="3"/><line x1="8" y1="6" x2="16" y2="6"/></svg>
          <span id="count-remaining" class="nav-badge">0</span>
        </div>
        <span class="nav-text">Découvrir</span>
      </button>
      <button class="nav-item" data-view="view-selection">
        <svg class="nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-text">Mes Films</span>
      </button>
    </nav>

    <!-- ============================================== -->
    <!-- FICHE FILM (BOTTOM SHEET MODAL)                -->
    <!-- ============================================== -->
    <div id="detail-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content detail-modal-content">
        <div class="sheet-handle"></div>
        <button id="btn-close-detail" class="btn-close detail-close" aria-label="Fermer">✕</button>
        <div id="detail-body"></div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="movies_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
